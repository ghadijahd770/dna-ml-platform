name: More compute or GPUs
description: More CPU nodes, or a GPU cluster, in your Azure ML workspace.
title: "[Compute] "
labels: ["request", "compute"]
body:
  - type: input
    id: team
    attributes:
      label: Team
      description: The team file name in requests/teams, e.g. dna
      placeholder: dna
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What do you need?
      options:
        - More CPU nodes
        - A GPU cluster
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: How many nodes, and for how long?
      placeholder: "4 nodes until the end of the month"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What is it for?
      description: GPUs need quota from Microsoft, which can take days, and approval from the budget owner.
    validations:
      required: true
