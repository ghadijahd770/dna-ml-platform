# Checks every change before it can be deployed. Needs no Azure login.
#   1. Bicep templates compile and pass the linter
#   2. The sandbox parameter file compiles against the template
#   3. Shell scripts pass shellcheck
name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bicep:
    name: Bicep build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install && az bicep version

      - name: Build templates
        run: |
          set -euo pipefail
          az bicep build --file infra/main.bicep --stdout > /dev/null
          for f in infra/modules/*.bicep; do
            echo "Building $f"
            az bicep build --file "$f" --stdout > /dev/null
          done

      - name: Build sandbox parameters
        run: az bicep build-params --file infra/sandbox.bicepparam --stdout > /dev/null

      - name: Lint
        run: az bicep lint --file infra/main.bicep

  scripts:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck scripts
        run: shellcheck -x scripts/*.sh policies/*.sh
