# Checks every change before it can be deployed. Needs no Azure login.
#   1. Terraform files are formatted and all three stacks pass terraform validate
#   2. Team files in requests/teams are valid YAML
#   3. Shell scripts pass shellcheck
name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [platform, requests/azure, requests/fabric]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Validate ${{ matrix.stack }}
        run: |
          terraform -chdir=${{ matrix.stack }} init -backend=false -input=false
          terraform -chdir=${{ matrix.stack }} validate

  team-files:
    name: Team files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check YAML
        run: |
          set -euo pipefail
          for f in requests/teams/*.yaml; do
            echo "Checking $f"
            yq e '.' "$f" > /dev/null
            [[ "$(yq e '.groups | type' "$f")" == "!!map" ]] || { echo "$f: groups must be a map"; exit 1; }
          done

  scripts:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck scripts
        run: shellcheck -x bootstrap/*.sh scripts/*.sh
