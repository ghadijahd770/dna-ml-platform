# Checks every change before it can be deployed. Needs no Azure login.
#   1. Terraform files are formatted, and both stacks pass terraform validate
#   2. Shell scripts pass shellcheck
name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform fmt -check -recursive -diff infra

      - name: Validate Azure stack
        run: |
          terraform -chdir=infra/azure init -backend=false -input=false
          terraform -chdir=infra/azure validate

      - name: Validate Fabric stack
        run: |
          terraform -chdir=infra/fabric init -backend=false -input=false
          terraform -chdir=infra/fabric validate

  scripts:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck scripts
        run: shellcheck -x scripts/*.sh policies/*.sh
