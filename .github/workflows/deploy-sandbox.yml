# Plans or applies the DNA ML sandbox Azure resources from GitHub, using the CI/CD
# managed identity (OIDC, no secrets). The Fabric stack is applied by a workspace admin
# with scripts/deploy-fabric.sh.
#
# Before the first run (see docs/deployment-runbook.md):
#   1. Run scripts/bootstrap-state.sh and scripts/deploy-sandbox.sh once from your machine.
#   2. Create a GitHub environment called "sandbox" (Settings > Environments) and add yourself
#      as a required reviewer, so every run needs a click from you.
#   3. Add these repository variables (Settings > Secrets and variables > Actions > Variables):
#        AZURE_CLIENT_ID          ci_client_id output of the first deployment
#        AZURE_TENANT_ID          your Entra tenant ID
#        AZURE_SUBSCRIPTION_ID    the sandbox subscription ID
#        DNA_ALERT_EMAIL          address that receives alerts
#        DNA_GROUP_PLATFORM_ADMINS, DNA_GROUP_DATA_ENGINEERS, DNA_GROUP_DATA_SCIENTISTS,
#        DNA_GROUP_ML_ENGINEERS, DNA_GROUP_GENAI_DEVELOPERS, DNA_GROUP_VIEWERS   group object IDs
name: Deploy sandbox

on:
  workflow_dispatch:
    inputs:
      plan_only:
        description: "Plan only (preview). Untick to apply."
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ inputs.plan_only && 'Plan' || 'Apply' }} sandbox
    runs-on: ubuntu-latest
    environment: sandbox
    defaults:
      run:
        working-directory: infra/azure
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_alert_email: ${{ vars.DNA_ALERT_EMAIL }}
      TF_VAR_group_ids: >-
        {"platform_admins":"${{ vars.DNA_GROUP_PLATFORM_ADMINS }}",
        "data_engineers":"${{ vars.DNA_GROUP_DATA_ENGINEERS }}",
        "data_scientists":"${{ vars.DNA_GROUP_DATA_SCIENTISTS }}",
        "ml_engineers":"${{ vars.DNA_GROUP_ML_ENGINEERS }}",
        "genai_developers":"${{ vars.DNA_GROUP_GENAI_DEVELOPERS }}",
        "viewers":"${{ vars.DNA_GROUP_VIEWERS }}"}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.sandbox.hcl

      - name: Terraform plan
        run: terraform plan -input=false -var-file=sandbox.tfvars -out=sandbox.tfplan

      - name: Terraform apply
        if: ${{ !inputs.plan_only }}
        run: terraform apply -input=false sandbox.tfplan
